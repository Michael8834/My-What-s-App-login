<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 90%;
      max-width: 360px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>My Website</h1>

    <form onsubmit="login(event)">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Log in</button>

      <p id="message"></p>

    </form>

  </div>

  <script>
    function login(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;

      document.getElementById("message").textContent =
        "Demo login submitted for " + email;
    }
  </script>

</body>
</html>
